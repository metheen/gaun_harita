server {
    listen 80;
    listen [::]:80;
    server_name harita.example.com;

    client_max_body_size 20m;

    access_log /var/log/nginx/gaunharita.access.log;
    error_log  /var/log/nginx/gaunharita.error.log warn;

    location ~ /\.(?!well-known) {
        deny all;
    }

    location ~* \.(?:env|sql|dump|log|bak|ini|conf)$ {
        deny all;
    }

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";

        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header Permissions-Policy "camera=(), microphone=(), payment=(), usb=(), geolocation=(self)" always;
    }
}
